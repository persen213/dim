// Senior (11th-Dimensional Manipulation): an add-on for Re:AcademyCraft 1.5.0 (Minecraft 1.20.1 / Forge 47.4.10).
// Built the same way as the SDK's sample add-on. Put the Re:AcademyCraft jar in ./libs (see libs/README.txt).
plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

group = 'dev.senior.dimension'
version = '0.1.0'
base { archivesName = 'seniordim-forge-1.20.1' }

java { toolchain.languageVersion = JavaLanguageVersion.of(17) }

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true
    runs {
        client {
            workingDirectory project.file('run')
            mods { seniordim { source sourceSets.main } }
        }
        server {
            workingDirectory project.file('run')
            args '--nogui'
            mods { seniordim { source sourceSets.main } }
        }
    }
}

repositories {
    // Re:AcademyCraft's jar is read from the local ./libs folder.
    flatDir { dirs 'libs' }
}

def academyVersion = project.findProperty('academyVersion') ?: '1.5.0'

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.10'
    // The mod jar is in release (SRG) names, so ForgeGradle converts it for development. It is NOT packed into our jar.
    // -PacademyApiOnly compiles against the SDK's API-only jar (libs/re-academycraft-forge-1.20.1-1.5.0-api.jar) instead.
    // Compile against the full mod jar if it is in ./libs, otherwise against the SDK's API-only jar (also in ./libs).
    def fullJar = file("libs/re-academycraft-forge-1.20.1-${academyVersion}.jar")
    def apiOnly = project.hasProperty('academyApiOnly') || !fullJar.exists()
    implementation fg.deobf("blank:re-academycraft-forge-1.20.1:${academyVersion}" + (apiOnly ? ':api' : ''))
}

tasks.named('processResources', ProcessResources) {
    filteringCharset = 'UTF-8'
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') { expand 'version': project.version }
}

tasks.named('jar', Jar) {
    finalizedBy 'reobfJar'
}
